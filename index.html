<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>VRS Camera Capture</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06111f;color:#fff}
body{display:flex;align-items:center;justify-content:center;min-height:100svh;padding:14px}
.camera-app{width:min(100%,520px);min-height:min(820px,96svh);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:#0b1a2c;box-shadow:0 24px 70px rgba(0,0,0,.45)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:linear-gradient(135deg,#083b75,#0b67cf,#12a5c4)}header h1{margin:0;font-size:18px}header p{margin:3px 0 0;font-size:12px;opacity:.88}
.close{border:0;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer}
.preview{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:360px;background:#020812;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block;background:#020812}
.status{position:absolute;left:14px;right:14px;top:14px;padding:11px 12px;border-radius:12px;background:rgba(0,0,0,.52);backdrop-filter:blur(8px);font-size:13px;line-height:1.4}
.error{display:none;margin:14px;padding:12px;border-radius:12px;background:#4a1515;border:1px solid #9d4141;color:#ffdada;font-size:13px;line-height:1.45}.error.show{display:block}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:#0b1a2c}button.action{min-height:52px;border:0;border-radius:14px;font-weight:800;cursor:pointer}.capture{background:#0b69d1;color:#fff;box-shadow:0 8px 20px rgba(11,105,209,.28)}.secondary{background:#20334a;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
.result{display:none;padding:16px;text-align:center;background:#0b1a2c}.result img{width:180px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid rgba(255,255,255,.14)}.result p{margin:10px 0 0;font-size:13px;color:#b8c7d9}
@media(max-width:600px){body{padding:0}.camera-app{width:100%;min-height:100svh;border:0;border-radius:0}.preview{min-height:0;flex:1}.controls{padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}.result{padding-bottom:calc(14px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<main class="camera-app">
<header><div><h1>Take Visitor Photo</h1><p>Camera only • No gallery upload</p></div><button id="closeBtn" class="close" type="button" aria-label="Close camera">×</button></header>
<section class="preview"><video id="video" autoplay playsinline muted></video><div id="status" class="status">Starting camera…</div></section>
<div id="error" class="error"></div>
<section id="result" class="result"><img id="resultImage" alt="Captured visitor photo preview"><p>Check the preview, then choose Use Photo or Retake.</p></section>
<div class="controls"><button id="captureBtn" class="action capture" type="button" disabled>Capture Photo</button><button id="retakeBtn" class="action secondary" type="button" disabled>Retake</button><button id="useBtn" class="action capture" type="button" disabled>Use Photo</button><button id="cancelBtn" class="action secondary" type="button">Cancel</button></div>
</main>
<script>
/* VRS Standalone Camera Capture | Version 7.6.0 | Updated 21 September 2026 */
(function(){"use strict";
const params=new URLSearchParams(location.search),nonce=params.get("nonce")||"",returnOrigin=params.get("returnOrigin")||"";
let stream=null,capturedDataUrl=null,capturedSize=0;
const video=document.getElementById("video"),status=document.getElementById("status"),errorBox=document.getElementById("error"),result=document.getElementById("result"),resultImage=document.getElementById("resultImage"),captureBtn=document.getElementById("captureBtn"),retakeBtn=document.getElementById("retakeBtn"),useBtn=document.getElementById("useBtn"),cancelBtn=document.getElementById("cancelBtn"),closeBtn=document.getElementById("closeBtn");
function setStatus(t){status.textContent=t}function showError(t){errorBox.textContent=t;errorBox.classList.add("show")}function clearError(){errorBox.textContent="";errorBox.classList.remove("show")}
function approxBytes(d){const i=String(d||"").indexOf(",");return i<0?0:Math.floor((d.length-i-1)*.75)}
function stopStream(){if(stream){stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});stream=null}video.srcObject=null}
function postResult(statusValue,photo,message){if(!window.opener||!returnOrigin||!nonce)return;window.opener.postMessage({type:"VRS_CAMERA_RESULT",nonce:nonce,status:statusValue,photo:photo||null,message:message||""},returnOrigin)}
function cancel(){stopStream();postResult("cancelled",null,"");try{window.close()}catch(e){}}
async function startCamera(){clearError();captureBtn.disabled=true;setStatus("Requesting camera permission…");if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showError("Secure camera access is unavailable. Open this page directly from an HTTPS host.");setStatus("Camera unavailable");return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:1280},height:{ideal:1280}},audio:false});video.srcObject=stream;await video.play();captureBtn.disabled=false;setStatus("Camera ready. Position the visitor and capture the photo.")}catch(err){console.error(err);stopStream();let m="Unable to access the camera. Please allow camera permission for this camera page and reopen it.";if(err&&err.name==="NotAllowedError")m="Camera permission was denied or blocked. Allow Camera for this camera site in browser site settings, then reopen the camera.";else if(err&&err.name==="NotFoundError")m="No camera was found on this device.";else if(err&&err.name==="NotReadableError")m="The camera is already in use by another application.";showError(m);setStatus("Camera permission is required")}}
function capture(){clearError();if(!stream||!video.videoWidth||!video.videoHeight){showError("The camera is not ready yet. Please wait a moment and try again.");return}const canvas=document.createElement("canvas"),max=1280,scale=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);const ctx=canvas.getContext("2d",{alpha:false});if(!ctx){showError("Unable to prepare the captured photo.");return}ctx.drawImage(video,0,0,canvas.width,canvas.height);let q=.82,data=canvas.toDataURL("image/jpeg",q);while(approxBytes(data)>2*1024*1024&&q>.45){q-=.07;data=canvas.toDataURL("image/jpeg",q)}const size=approxBytes(data);if(size>2*1024*1024){showError("The captured photo is too large. Please retake the photo.");return}capturedDataUrl=data;capturedSize=size;resultImage.src=data;result.style.display="block";useBtn.disabled=false;retakeBtn.disabled=false;captureBtn.disabled=true;setStatus("Photo captured. Review the preview.")}
function retake(){clearError();capturedDataUrl=null;capturedSize=0;resultImage.removeAttribute("src");result.style.display="none";useBtn.disabled=true;retakeBtn.disabled=true;captureBtn.disabled=false;setStatus("Camera ready. Capture another photo.")}
function usePhoto(){if(!capturedDataUrl)return;stopStream();postResult("success",{fileName:"visitor-camera-photo.jpg",mimeType:"image/jpeg",size:capturedSize,dataUrl:capturedDataUrl},"");setStatus("Photo sent to registration form.");setTimeout(function(){try{window.close()}catch(e){}},100)}
captureBtn.addEventListener("click",capture);retakeBtn.addEventListener("click",retake);useBtn.addEventListener("click",usePhoto);cancelBtn.addEventListener("click",cancel);closeBtn.addEventListener("click",cancel);window.addEventListener("beforeunload",stopStream);
if(!nonce||!returnOrigin||!window.opener){showError("This camera page must be opened from the Visitor Registration form.");setStatus("Invalid camera request")}else startCamera();
})();
</script>
</body>
</html>
